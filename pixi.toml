[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "bajo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
download_assets = "bash scripts/download_assets.sh"
install_prek = "prek install"
fmt = "mojo format ."
clean = "bash scripts/clean.sh"

# examples
example_lbvh = { cmd = "mojo -I . examples/lbvh_normals.mojo", depends-on = ["download_assets"] }
example_rtiaw = "mojo -I . examples/rtiaw.mojo"
example_cornell = "mojo -I . examples/cornell_box.mojo"
example_mis_showcase = "mojo -I . examples/mis_showcase.mojo"
example_pbrt = "mojo -I . examples/pbrt_scene.mojo"
viewer = "python tools/viewer.py"

# tests
test = { cmd = "bash scripts/run_tests.sh test/{{suite}}", args = [
  { arg = "suite", default = "."}
], env = { BAJO_TEST_GPU = "1" } }

test_host = { depends-on = [
  { task = "test", args = ["core"] },
  { task = "test", args = ["parser"] },
  { task = "test", args = ["rt/cpu"] },
  { task = "test", args = ["bvh/cpu"] },
  { task = "test", args = ["sort/cpu"] },
  { task = "test", args = ["viewer/test_linear_frame.mojo"] },
  "test_python_host",
] }
test_gpu = { depends-on = [
  { task = "test", args = ["sort/gpu"] },
  { task = "test", args = ["bvh/gpu"] },
  { task = "test", args = ["rt/gpu"] },
  { task = "test", args = ["gpu"] },
  "test_python_gpu",
] }

test_python_host = "bash scripts/run_tests.sh test/viewer/test_viewer_extensions.py test/viewer/test_viewer_cpu.py"
test_python_gpu = { cmd = "python test/viewer/test_viewer_gpu.py", env = { BAJO_TEST_GPU = "1" } }

############
# benchmarks
############

# sort
bench_sort_mojo = { cmd = "bash -lc 'cd bench/sort && mojo run -I ../.. bench_gpu_sort.mojo'" }
plot_sort = { cmd = "bash -lc 'cd bench/sort && python plot_gpu_sort.py gpu_sort_benchmark_results.csv'" }


# parsers: whole-file loading, not individual implementation stages
bench_obj = { cmd = "mojo -I . bench/parser/bench_loaders.mojo obj {{path}}", args = [
  { arg = "path", default = "./assets/dragon/dragon.obj" },
], depends-on = ["download_assets"] }
bench_ply = { cmd = "mojo -I . bench/parser/bench_loaders.mojo ply {{path}}", args = [
  { arg = "path", default = "./assets/crown/geometry/mesh_00009.ply" },
], depends-on = ["download_assets"] }


# bvh cpu
bench_bvh_cpu_grid = "mojo -I . bench/bvh/bench_cpu_bvh_grid.mojo"
bench_bvh_cpu_dragon = { cmd = "mojo -I . bench/bvh/bench_cpu_bvh_dragon.mojo", depends-on = ["download_assets"] }
bench_bvh_cpu_packets = { cmd = "mojo -I . bench/bvh/bench_cpu_bvh_packets.mojo", depends-on = ["download_assets"] }
bench_bvh_cpu_instances = { cmd = "mojo -I . bench/bvh/bench_cpu_bvh_instances.mojo", depends-on = ["download_assets"] }
bench_bvh_cpu_blas_set = "mojo -I . bench/bvh/bench_cpu_blas_set_build.mojo"
bench_bvh_cpu_spatial_groups = "mojo -I . bench/bvh/bench_cpu_spatial_groups.mojo"


# bvh gpu
bench_bvh_gpu = {cmd = "mojo -I . bench/bvh/bench_gpu_bounds_bvh.mojo",  depends-on = ["download_assets"] }
bench_bvh_gpu_spatial_bounds_updates = "mojo -I . bench/bvh/bench_gpu_spatial_bounds_updates.mojo"
bench_bvh_gpu_tlas = { cmd = "mojo -I . bench/bvh/bench_gpu_tlas.mojo",  depends-on = ["download_assets"] }
bench_bvh_gpu_blas_tlas_build = { cmd = "mojo -I . --target-accelerator sm_120 bench/bvh/bench_gpu_blas_tlas_build.mojo", depends-on = ["download_assets"] }
bench_bvh_gpu_sweep = { cmd = "mojo -I . bench/bvh/bench_gpu_bvh_sweep.mojo", depends-on = ["download_assets"] }

# ray tracing cpu: scalar, native SIMD and parallel SIMD
bench_rt_cpu = "mojo -I . bench/rt/bench_cpu_rt.mojo"

# ray tracing gpu
bench_rt_gpu = "mojo -I . bench/rt/bench_gpu_rt.mojo"
bench_rt_gpu_mixed = "mojo -I . bench/rt/bench_gpu_rt.mojo mixed"
bench_rt_cpu_gpu = "mojo -I . bench/rt/bench_cpu_gpu_rt.mojo"

# Small, self-contained CPU runs; downloaded assets and GPU sweeps are explicit.
bench_smoke = { depends-on = ["bench_bvh_cpu_grid", "bench_rt_cpu"] }
bench_bvh_smoke = { depends-on = ["bench_bvh_cpu_grid"] }

[dependencies]
libpng = ">=1.6.59,<2"
mojo = ">=1.3.0.dev2026102305,<2"
max = ">=26.8.0.dev2026102305,<27"
python = ">=3.13.17,<3.14"
polars = ">=2.0.0,<3"
matplotlib = ">=3.11.2,<4"
numpy = ">=2.5.4,<3"
pillow = ">=13.0.0,<14"
