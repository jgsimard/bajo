[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "bajo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
download_assets = "bash scripts/download_assets.sh"
install_prek = "prek install"
fmt = "mojo format ."

# examples
example_lbvh = { cmd = "mojo -I . examples/lbvh_normals.mojo", depends-on = ["download_assets"] }
example_rtiaw = "mojo -I . examples/rtiaw.mojo"

# tests
test = { cmd = "bash scripts/run_tests.sh test/{{suite}}", args = [
  { arg = "suite", default = "."}
] }

test_host = { depends-on = [
  { task = "test", args = ["core"] },
  { task = "test", args = ["obj"] },
  { task = "test", args = ["rt"] },
  { task = "test", args = ["bvh/cpu"] },
] }
test_gpu = { depends-on = [
  { task = "test", args = ["sort"] },
  { task = "test", args = ["bvh/gpu"] },
] }

############
# benchmarks
############

# sort
bench_sort_mojo = { cmd = "bash -lc 'cd bench/sort && mojo run -I ../.. bench_gpu_sort.mojo'" }
bench_sort_cub = { cmd = "bash -lc 'cd bench/sort && make run-radix'" }
plot_sort = { cmd = "bash -lc 'cd bench/sort && python plot_gpu_sort.py gpu_sort_benchmark_results.csv cub_sort_benchmark_results.csv'" }


# bench core
bench_quat = "mojo -I. bench/core/bench_quat.mojo"
bench_aabb = "mojo -I. bench/core/bench_aabb.mojo"
bench_obj = { cmd = "mojo -I. bench/obj/bench_obj.mojo", depends-on = ["download_assets"] }


# bvh cpu
bench_bvh_cpu_grid = "mojo -I . bench/bvh/bench_cpu_bvh_grid.mojo"
bench_bvh_cpu_dragon = { cmd = "mojo -I . bench/bvh/bench_cpu_bvh_dragon.mojo", depends-on = ["download_assets"] }
bench_bvh_cpu_embree = { cmd = "bash -lc 'g++ -O3 -march=native -DNDEBUG -std=c++20 bench/bvh/bench_embree_cpu.cpp -lembree4 -o /tmp/bajo_bench_embree_cpu && /tmp/bajo_bench_embree_cpu assets/dragon/dragon.obj'", depends-on = ["download_assets"] }
bench_bvh_cpu_tinybvh = { cmd = "bash bench/bvh/bench_tinybvh.sh ./assets/dragon/dragon.obj", depends-on = ["download_assets"] }
bench_bvh_cpu_compare = { cmd = "bash bench/bvh/bench_bvh_cpu_compare.sh", depends-on = ["download_assets"] }
bench_bvh_cpu_report = { cmd = "python bench/bvh/bench_bvh_cpu_report.py", depends-on = ["download_assets"] }


# bvh gpu
bench_bvh_gpu = {cmd = "mojo -I . bench/bvh/bench_gpu_bounds_bvh.mojo",  depends-on = ["download_assets"] }
bench_bvh_gpu_tlas = { cmd = "mojo -I . bench/bvh/bench_gpu_tlas.mojo",  depends-on = ["download_assets"] }
bench_all = { depends-on = [
  "bench_quat",
  "bench_aabb",
  "bench_obj",
  "bench_bvh_cpu_grid",
  "bench_bvh_cpu_dragon",
  "bench_bvh_gpu",
  "bench_bvh_gpu_tlas"
] }
bench_bvh = { depends-on = [
  "bench_bvh_cpu",
  "bench_bvh_gpu",
  "bench_bvh_gpu_tlas"
] }

[dependencies]
mojo = ">=1.1.0.dev2026080905,<2"
max = ">=26.6.0.dev2026080905,<27"
python = ">=3.14.6,<3.15"
polars = ">=1.43.2,<2"
matplotlib = ">=3.11.1,<4"
